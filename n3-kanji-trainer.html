<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N3 Kanji Trainer — 6 Weeks</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b2e; --card:#1d2238; --card2:#252b45;
  --tx:#e9ecf7; --mut:#9aa3c4; --acc:#6c8cff; --acc2:#8f6cff;
  --ok:#35c98a; --bad:#ff6b7a; --warn:#ffc46b; --line:#2c3350;
  --r:14px; --sh:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(180deg,#0f1220,#141829 60%,#0f1220);
  color:var(--tx); min-height:100vh;
  font-family:"Segoe UI",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
.jp{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,"MS Gothic","Noto Sans JP",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:12px;padding:14px 0 18px;flex-wrap:wrap}
header.top h1{font-size:19px;margin:0;letter-spacing:.3px}
header.top .sub{color:var(--mut);font-size:12px}
.spacer{flex:1}
.btn{
  background:var(--card2);color:var(--tx);border:1px solid var(--line);
  padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;
  transition:.15s; font-family:inherit;
}
.btn:hover{background:#2f3757;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.g6{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.weekcard{cursor:pointer;transition:.15s}
.weekcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.weekcard .wt{font-size:16px;font-weight:700;margin:2px 0 8px}
.bar{height:7px;background:#12162a;border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7ee3b8);width:0}
.chip{display:inline-block;background:#12162a;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:11.5px;color:var(--mut);margin-right:6px}
.chip.ok{color:var(--ok);border-color:#255c46}
.chip.due{color:var(--warn);border-color:#5c4a25}
.daytile{cursor:pointer;text-align:center;padding:14px 10px;transition:.15s}
.daytile:hover{border-color:var(--acc);transform:translateY(-2px)}
.daytile .d{font-size:11px;color:var(--mut);letter-spacing:1px}
.daytile .kj{font-size:26px;margin:6px 0 4px;letter-spacing:2px}
.daytile .tt{font-size:12px;color:var(--mut);line-height:1.35;min-height:32px}
.kcard{padding:18px}
.kbig{font-size:76px;line-height:1.05;text-align:center;margin:4px 0 10px}
.rowline{display:flex;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed #2a3050}
.rowline b{color:var(--mut);font-weight:600;min-width:74px;font-size:12.5px;padding-top:2px}
.vocab li{margin:4px 0;font-size:14.5px}
.sent{background:#12162a;border-left:3px solid var(--acc);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:15px;line-height:1.6}
.sent .en{color:var(--mut);font-size:12.5px;display:block;margin-top:5px}
.hidewhenoff{display:none}
body.hints .hidewhenoff{display:inline}
body.hints .sent .en{display:block}
.qbox{padding:20px}
.qtag{font-size:11px;letter-spacing:1px;color:var(--acc);text-transform:uppercase;font-weight:700}
.qtext{font-size:19px;margin:10px 0 6px;line-height:1.5}
.qfocus{font-size:56px;text-align:center;margin:8px 0 14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:6px}
.opt{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;
  cursor:pointer;font-size:16px;text-align:left;transition:.12s;color:var(--tx);font-family:inherit;
}
.opt:hover:not(:disabled){border-color:var(--acc);background:#2f3757}
.opt.correct{background:rgba(53,201,138,.16);border-color:var(--ok)}
.opt.wrong{background:rgba(255,107,122,.16);border-color:var(--bad)}
.opt:disabled{cursor:default}
.prog{height:6px;background:#12162a;border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.fb{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;line-height:1.6}
.fb.ok{background:rgba(53,201,138,.12);border:1px solid #2a6b52}
.fb.bad{background:rgba(255,107,122,.12);border:1px solid #6b2a33}
.score{font-size:52px;font-weight:800;text-align:center;margin:6px 0}
.center{text-align:center}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav.tabs .btn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none}
label.sw{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer}
select,input[type=number]{
  background:var(--card2);color:var(--tx);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-size:14px;font-family:inherit;
}
table.st{width:100%;border-collapse:collapse;font-size:13.5px}
table.st th,table.st td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.st th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.kpill{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:#12162a;border:1px solid var(--line);font-size:20px;margin:3px}
.kpill.b0{border-color:var(--bad)} .kpill.b1,.kpill.b2{border-color:var(--warn)}
.kpill.b3,.kpill.b4{border-color:#3d6bbf} .kpill.b5{border-color:var(--ok)}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(15,18,32,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px}
.foot .wrap2{max-width:960px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .n{font-size:28px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
@media(max-width:560px){.kbig{font-size:60px}.qfocus{font-size:44px}.wrap{padding:12px 12px 110px}}
</style>
</head>
<body class="hints">
<div class="wrap">
  <header class="top">
    <div>
      <h1>N3 Kanji Trainer <span class="muted small">/ 漢字</span></h1>
      <div class="sub" id="subline">6 weeks · 36 days · 280 kanji entries</div>
    </div>
    <div class="spacer"></div>
    <label class="sw"><input type="checkbox" id="hintToggle" checked> Show readings &amp; translations</label>
    <button class="btn sm ghost" id="resetBtn">Reset progress</button>
  </header>
  <nav class="tabs" id="tabs">
    <button class="btn sm on" data-go="home">Study</button>
    <button class="btn sm" data-go="practice">Free practice</button>
    <button class="btn sm" data-go="stats">Progress</button>
  </nav>
  <main id="view"></main>
</div>
<div class="foot" id="foot" style="display:none"><div class="wrap2" id="footInner"></div></div>

const KEY = 'kanji_n3_trainer_v1';
const INTERVALS = [0,1,2,4,7,15,30];      // days per Leitner box
const MAXBOX = 6;
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const dkey = (w,d) => w+'-'+d;

/* ---------------- state ---------------- */
const blank = () => ({srs:{},days:{},log:{},settings:{hints:true,strokeQ:false},created:todayISO()});
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r&&r.srs) return Object.assign(blank(),r); }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ console.warn('save failed',e); } }
function srs(id){ return S.srs[id] || (S.srs[id]={box:0,due:todayISO(),seen:0,ok:0,ng:0,last:null}); }
function grade(id,correct){
  const r = srs(id); r.seen++;
  if(correct){ r.ok++; r.box = Math.min(MAXBOX, r.box+1); }
  else { r.ng++; r.box = 0; }
  r.due = addDays(INTERVALS[r.box]); r.last = todayISO();
}
const isDue = id => { const r=S.srs[id]; return r ? r.due <= todayISO() : false; };
const mastered = id => { const r=S.srs[id]; return !!r && r.box>=4; };

const WEEKS = [...new Set(DATA.map(k=>k.week))].sort((a,b)=>a-b);
const weekTitle = w => (DATA.find(k=>k.week===w)||{}).weekTitle || ('Week '+w);
const inWeek  = w => DATA.filter(k=>k.week===w);
const inDay   = (w,d) => DATA.filter(k=>k.week===w && k.day===d);
const daysOf  = w => [...new Set(inWeek(w).map(k=>k.day))].sort((a,b)=>a-b);
const studiedIds = () => Object.keys(S.srs).map(Number);
const studiedCards = () => DATA.filter(k=>S.srs[k.id]);

/* ---------------- question engine ---------------- */
function pickDistract(card, pool, valueOf, correctVal, n){
  const seen = new Set([String(correctVal)]);
  const out = [];
  const tiers = [pool.filter(c=>c.id!==card.id), DATA.filter(c=>c.id!==card.id)];
  for(const tier of tiers){
    for(const c of shuffle(tier)){
      const v = valueOf(c);
      if(!v) continue;
      const s = String(v);
      if(seen.has(s)) continue;
      seen.add(s); out.push(v);
      if(out.length>=n) return out;
    }
  }
  return out;
}
function mcq(card, type, prompt, focus, correct, distract, explain){
  if(distract.length < 2) return null;
  const opts = shuffle([correct, ...distract.slice(0,3)]);
  return {cardId:card.id, kanji:card.kanji, type, prompt, focus, correct:String(correct), options:opts.map(String), explain};
}
const firstReading = c => (c.on || c.kun || '').split(' / ')[0].trim();
const explainOf = c =>
  `<b class="jp" style="font-size:22px">${c.kanji}</b> — ${c.meaning}<br>` +
  `<span class="muted small">on: ${c.on||'—'} · kun: ${c.kun||'—'} · ${c.strokes} strokes</span><br>` +
  `<span class="small jp">${c.vocab.map(v=>`${v.w} (${v.r}${v.m?' – '+v.m:''})`).join('、')}</span><br>` +
  `<span class="small jp">${c.sentence.jp}</span> <span class="muted small">${c.sentence.en}</span>`;

const BUILDERS = {
  k2m: (c,pool) => mcq(c,'Kanji → Meaning','What does this kanji mean?', c.kanji, c.meaning,
        pickDistract(c,pool,x=>x.meaning,c.meaning,6), explainOf(c)),
  m2k: (c,pool) => mcq(c,'Meaning → Kanji',`Which kanji means “${c.meaning}”?`, null, c.kanji,
        pickDistract(c,pool,x=>x.kanji,c.kanji,6), explainOf(c)),
  k2r: (c,pool) => { const r = firstReading(c); if(!r) return null;
        return mcq(c,'Kanji → Reading','Which reading belongs to this kanji?', c.kanji, r,
        pickDistract(c,pool,x=>firstReading(x),r,6), explainOf(c)); },
  v2r: (c,pool) => { if(!c.vocab.length) return null;
        const v = c.vocab[Math.random()*c.vocab.length|0]; if(!v.r) return null;
        return mcq(c,'Vocabulary → Reading',`How do you read this word?${v.m?' <span class="muted small">('+v.m+')</span>':''}`, v.w, v.r,
        pickDistract(c,pool,x=>(x.vocab[0]||{}).r,v.r,6), explainOf(c)); },
  cloze: (c,pool) => { const s=c.sentence.jp; if(!s.includes(c.kanji)) return null;
        const blanked = s.replace(c.kanji,'<span style="color:var(--warn)">＿</span>');
        return mcq(c,'Sentence cloze',
          `Which kanji fills the blank?<div class="sent jp" style="margin-top:10px">${blanked}<span class="en">${c.sentence.en}</span></div>`,
          null, c.kanji, pickDistract(c,pool,x=>x.kanji,c.kanji,6), explainOf(c)); },
  strokes: (c,pool) => mcq(c,'Stroke count','How many strokes does this kanji have?', c.kanji, c.strokes,
        pickDistract(c,pool,x=>x.strokes,c.strokes,6), explainOf(c))
};
function buildQuestions(cards, pool, count){
  const types = ['k2m','k2r','v2r','cloze','m2k'].concat(S.settings.strokeQ?['strokes']:[]);
  const qs = [];
  let guard = 0;
  const order = shuffle(cards);
  let i = 0;
  while(qs.length < count && guard++ < count*12){
    const c = order[i++ % order.length];
    const t = types[(qs.length + (Math.random()*types.length|0)) % types.length];
    const q = BUILDERS[t](c, pool);
    if(!q) continue;
    if(qs.some(x=>x.cardId===q.cardId && x.type===q.type)) continue;
    qs.push(q);
  }
  return shuffle(qs);
}

/* ---------------- router ---------------- */
let CUR = {};
function go(name, arg){ CUR = {name,arg}; $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.go===name)); VIEWS[name](arg); window.scrollTo(0,0); }
function foot(nodes){ const f=$('#foot'), i=$('#footInner'); i.innerHTML=''; if(!nodes||!nodes.length){f.style.display='none';return;} nodes.forEach(n=>i.appendChild(n)); f.style.display='block'; }
function button(label, cls, fn){ const b=el('button','btn '+(cls||''),label); b.onclick=fn; return b; }

VIEWS.lesson = (a) => {
  const cards = inDay(a.w,a.d);
  const i = Math.max(0, Math.min(a.i, cards.length-1));
  const c = cards[i];

  const bar = el('div','flex'); bar.style.marginBottom='12px';

  bar.appendChild(el('div','chip',`Week ${a.w} · Day ${a.d}`));
  bar.appendChild(el('div','small jp muted',c.dayTitle));
  v.appendChild(bar);
  v.appendChild(el('div','prog','<i style="width:'+((i+1)/cards.length*100)+'%"></i>'));

  const card = el('div','card kcard');
  const r = srs(c.id);
  card.innerHTML = `
    <div class="kbig jp">${c.kanji}</div>
    <div class="center small muted" style="margin-bottom:12px">${i+1} / ${cards.length} · ${c.strokes} strokes · box ${r.box}/${MAXBOX}</div>
    <div class="rowline"><b>Meaning</b><div>${c.meaning}</div></div>
    <div class="rowline"><b>On'yomi</b><div class="jp">${c.on||'<span class="muted">—</span>'}</div></div>
    <div class="rowline"><b>Kun'yomi</b><div class="jp">${c.kun||'<span class="muted">—</span>'}</div></div>
    <div class="rowline" style="border:none"><b>Vocabulary</b><div><ul class="vocab jp" style="margin:0;padding-left:18px">
      ${c.vocab.map(x=>`<li>${x.w} <span class="muted small">${x.r}${x.m?' · '+x.m:''}</span></li>`).join('')}
    </ul></div></div>
    <div class="sent jp">${c.sentence.jp}<span class="en">${c.sentence.en}</span></div>`;
  v.appendChild(card);

  S.days[dkey(a.w,a.d)] = Object.assign({studied:true}, S.days[dkey(a.w,a.d)]);
  if(!S.srs[c.id]) srs(c.id);
  save();

  const prev = button('← Prev','sm',()=>go('lesson',{w:a.w,d:a.d,i:i-1})); prev.disabled = i===0;
  const next = button('Next →','sm',()=>go('lesson',{w:a.w,d:a.d,i:i+1})); next.disabled = i===cards.length-1;
  const quiz = button(i===cards.length-1?'Take the day quiz →':'Skip to day quiz', i===cards.length-1?'primary':'ghost sm',
    ()=>startQuiz({title:`Week ${a.w} · Day ${a.d} quiz`, cards, pool:inWeek(a.w),
      count:Math.max(10, cards.length*2), back:['lesson',{w:a.w,d:a.d,i:0}], day:[a.w,a.d]}));
  foot([prev,next,el('div','spacer'),el('div','small muted',`Day ${a.d}: ${cards.length} kanji`),quiz]);
};

/* ---- QUIZ ---- */
let Q = null;
function startQuiz(cfg){
  const qs = buildQuestions(cfg.cards, cfg.pool||DATA, Math.min(cfg.count, cfg.cards.length*4));
  if(!qs.length){ alert('No questions could be generated for this selection.'); return; }
  Q = {cfg, qs, i:0, right:0, answers:[]};
  go('quiz');
}
VIEWS.quiz = () => {
  const v = $('#view'); v.innerHTML='';
  const q = Q.qs[Q.i];
  const bar = el('div','flex'); bar.style.marginBottom='10px';
  bar.appendChild(button('✕ Quit','sm ghost',()=>{ if(confirm('Quit this quiz? Progress in it is lost.')) go(...Q.cfg.back); }));
  bar.appendChild(el('div','chip',Q.cfg.title));
  bar.appendChild(el('div','spacer'));
  bar.appendChild(el('div','small muted',`Q${Q.i+1} / ${Q.qs.length} · ${Q.right} correct`));
  v.appendChild(bar);
  v.appendChild(el('div','prog','<i style="width:'+(Q.i/Q.qs.length*100)+'%"></i>'));

  const box = el('div','card qbox');
  box.appendChild(el('div','qtag',q.type));
  box.appendChild(el('div','qtext',q.prompt));
  if(q.focus) box.appendChild(el('div','qfocus jp',q.focus));
  const opts = el('div','opts');
  q.options.forEach(o=>{
    const b = el('button','opt jp',o);
    b.onclick = ()=>answer(b,o,q,box,opts);
    opts.appendChild(b);
  });
  box.appendChild(opts);
  v.appendChild(box);
  foot(null);
};
function answer(btn,val,q,box,opts){
  const correct = String(val) === q.correct;
  [...opts.children].forEach(b=>{ b.disabled = true;
    if(b.textContent === q.correct) b.classList.add('correct');
  });
  if(!correct) btn.classList.add('wrong');
  if(correct) Q.right++;
  grade(q.cardId, correct); save();
  Q.answers.push({q, correct});
  const fb = el('div','fb '+(correct?'ok':'bad'),
    (correct?'<b style="color:var(--ok)">✓ Correct</b>':`<b style="color:var(--bad)">✗ Answer: ${q.correct}</b>`)+'<br>'+q.explain);
  box.appendChild(fb);
  const nx = button(Q.i===Q.qs.length-1?'See results →':'Next question →','primary',()=>{
    Q.i++; if(Q.i>=Q.qs.length) finish(); else go('quiz');
  });
  foot([el('div','small muted',correct?'Nice — moving up a box.':'Reset to box 0, you will see it again tomorrow.'),el('div','spacer'),nx]);
  nx.focus();
}
function finish(){
  const pct = Math.round(Q.right/Q.qs.length*100);
  const c = Q.cfg;
  if(c.day){ const k = dkey(c.day[0],c.day[1]); const s = S.days[k]||(S.days[k]={});
    s.studied = true; s.attempts = (s.attempts||0)+1; s.quizBest = Math.max(s.quizBest||0, pct); s.last = todayISO(); }
  if(c.weekTest){ S.days['W'+c.weekTest] = {test:Math.max((S.days['W'+c.weekTest]||{}).test||0, pct), last:todayISO()}; }
  const lg = S.log[todayISO()] || (S.log[todayISO()]={q:0,ok:0});
  lg.q += Q.qs.length; lg.ok += Q.right;
  save(); go('results');
}
VIEWS.results = () => {
  const v = $('#view'); v.innerHTML='';
  const pct = Math.round(Q.right/Q.qs.length*100);
  const wrong = Q.answers.filter(a=>!a.correct);
  const c = el('div','card center');
  c.innerHTML = `<div class="chip">${Q.cfg.title}</div>
    <div class="score" style="color:${pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)'}">${pct}%</div>
    <div class="muted">${Q.right} of ${Q.qs.length} correct</div>
    <div class="small muted" style="margin-top:8px">${pct>=80?'合格！ Strong pass — these move up a box.':pct>=60?'Almost there — review the misses below.':'Study this day again before moving on.'}</div>`;
  v.appendChild(c);
  if(wrong.length){
    const w = el('div','card'); w.style.marginTop='14px';
    w.innerHTML = `<b>Review your ${wrong.length} miss${wrong.length===1?'':'es'}</b>`;
    wrong.forEach(a=>{ const d=el('div','fb bad'); d.style.marginTop='10px'; d.innerHTML=a.q.explain; w.appendChild(d); });
    v.appendChild(w);
  }
  const acts = [button('← Back','sm ghost',()=>go(...Q.cfg.back))];
  if(wrong.length) acts.push(button('Retry the misses','sm',()=>startQuiz({
    title:Q.cfg.title+' — retry', cards:DATA.filter(k=>wrong.some(a=>a.q.cardId===k.id)),
    pool:Q.cfg.pool||DATA, count:wrong.length*2, back:Q.cfg.back})));
  acts.push(el('div','spacer'));
  acts.push(button('Home','primary sm',()=>go('home')));
  foot(acts);
};

/* ---- STATS ---- */
VIEWS.stats = () => {
  foot(null);
  const v = $('#view'); v.innerHTML='';
  const st = studiedCards();
  const totQ = Object.values(S.log).reduce((a,b)=>a+b.q,0);
  const totOk = Object.values(S.log).reduce((a,b)=>a+b.ok,0);
  const days = Object.keys(S.log).sort();

  while(S.log[d.toISOString().slice(0,10)]){ streak++; d.setDate(d.getDate()-1); }
  const g = el('div','grid g4');
  [['Kanji studied',st.length+' / '+DATA.length],['Mastered',DATA.filter(k=>mastered(k.id)).length],
   ['Lifetime accuracy',totQ?Math.round(totOk/totQ*100)+'%':'—'],['Day streak',streak]]
   .forEach(([l,n])=>g.appendChild(el('div','stat',`<div class="n">${n}</div><div class="l">${l}</div>`)));

  const t = el('div','card'); t.style.marginTop='14px';

      <td>${cs.filter(k=>mastered(k.id)).length}</td>

  </table>`;
  v.appendChild(t);

  const leech = st.filter(k=>S.srs[k.id].ng>=2).sort((a,b)=>S.srs[b.id].ng-S.srs[a.id].ng).slice(0,24);

      :'<span class="muted small">None yet — take some quizzes.</span>'}</div>`;

  v.appendChild(l);

  const box = el('div','card'); box.style.marginTop='14px';

  box.innerHTML = `<b>Leitner box distribution</b>
    <table class="st" style="margin-top:6px"><tr><th>Box</th>${counts.map((_,i)=>`<th>${i}</th>`).join('')}</tr>
    <tr><td class="muted">kanji</td>${counts.map(c=>`<td>${c}</td>`).join('')}</tr>
    <tr><td class="muted">next gap</td>${INTERVALS.map(d=>`<td class="small muted">${d}d</td>`).join('')}</tr></table>`;

};
